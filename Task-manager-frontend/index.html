<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="./img/icono.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <title>TASK MANAGER</title>
</head>

<body>
    <!-- MODAL DE ACCESO / REGISTRO -->
    <div id="auth-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <!-- VISTA INICIAR SESIÓN -->
            <div id="login-container">
                <h2 class="text-tittle-modal">Iniciar Sesión</h2>
                <form id="auth-form">
                    <input type="email" id="inputEmail" placeholder="Correo electrónico" aria-label="Correo electrónico" required>
                    <input type="password" id="inputPassword" placeholder="Contraseña" aria-label="Contraseña" required>
                    <div class="checkbox-container">
                        <input type="checkbox" id="checkPassLogin"><label for="checkPassLogin">Mostrar contraseña</label>
                    </div>
                    <button type="submit" id="btnLogin" class="buttons">Acceder</button>
                    <span id="text-link-register">¿ERES NUEVO? <a href="#" id="link-to-register">REGÍSTRATE</a></span>
                </form>
            </div>

            <!-- VISTA REGISTRO (oculta por defecto) -->
            <div id="register-container" class="hidden">
                <h2 class="text-tittle-modal">Crear Cuenta</h2>
                <form id="register-form">
                    <input type="text" id="regName" placeholder="Nombre completo" aria-label="Nombre completo" required>
                    <input type="email" id="regEmail" placeholder="Correo electrónico" aria-label="Correo electrónico" required>
                    <input type="password" id="regPassword" placeholder="Contraseña" aria-label="Contraseña" required>
                    <div class="checkbox-container">
                        <input type="checkbox" id="checkPassRegister"><label for="checkPassRegister">Mostrar contraseña</label>
                    </div>
                    <button type="submit" id="btnRegister" class="buttons">Registrarse</button>
                    <span>¿YA TIENES CUENTA? <a href="#" id="link-to-login">INICIA SESIÓN</a></span>
                </form>
            </div>
        </div>
    </div>

    <div id="app-content" class="blurred">
        <header>
            <section id="section-logoNameOut">
                <div class="avatar">
                    <span id="letter-logo"></span>
                </div>
                <div>
                    <h1 id="user-name">Usuario</h1>
                    <p id="task-of">Tareas</p>
                </div>
                <div>
                    <button id="btnLogout" class="buttons">Cerrar sesión</button>
                </div>
            </section>
            <section id="section-pending">
                <p id="text-total" class="text-infoTasks">Total: 0</p>
                <p id="text-pending" class="text-infoTasks">Pendientes: 0</p>
            </section>
        </header>
        <main>
            <div id="insert-data">
                <div id="div-inputTask">
                    <input id="inputTarea" placeholder="Nueva tarea" aria-label="Nueva tarea">
                    <button id="btnAgregar" class="buttons">Agregar</button>
                </div>
                <div id="div-inputDate">
                    <div>
                        <label for="inputDate">Fecha de vencimiento:</label>
                        <input type="date" id="inputDate">
                    </div>
                    <div>
                        <input type="checkbox" id="noDateCheckbox">
                        <label for="noDateCheckbox">Sin vencimiento</label>
                    </div>
                </div>
            </div>
            <div id="div-filters">
                <button id="buttonAll" class="filter-btn buttons">Todas</button>
                <button id="buttonPending" class="filter-btn buttons">Pendientes</button>
                <button id="buttonCompleted" class="filter-btn buttons">Completadas</button>
            </div>
            <div id="list-data">
                <ul id="lista"></ul>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="./js/app.js"></script>
</body>

</html>
