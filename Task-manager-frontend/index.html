<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="./img/icono.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <title>TASK MANAGER</title>
</head>

<body>
    <!-- MODAL DE ACCESO / REGISTRO -->
    <div id="auth-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <!-- VISTA INICIAR SESIÓN -->
            <div id="login-container">
                <h2 class="text-tittle-modal">Iniciar Sesión</h2>
                <form id="auth-form">
                    <input type="email" id="inputEmail" placeholder="Correo electrónico" required>
                    <input type="password" id="inputPassword" placeholder="Contraseña" required>
                    <div class = "checkbox-container">
                        <input type="checkbox" id="checkPassLogin"><span>Mostrar contraseña</span>
                    </div>
                    <button type="submit" id="btnLogin" class="buttons">Acceder</button>
                    <span id="text-link-register">¿ERES NUEVO? <a href="#" id="link-to-register">REGÍSTRATE</a></span>
                </form>
            </div>

            <!-- VISTA REGISTRO (oculta por defecto) -->
            <div id="register-container" class="hidden">
                <h2 class="text-tittle-modal">Crear Cuenta</h2>
                <form id="register-form">
                    <input type="text" id="regName" placeholder="Nombre completo" required>
                    <input type="email" id="regEmail" placeholder="Correo electrónico" required>
                    <input type="password" id="regPassword" placeholder="Contraseña" required>
                    <div class = "checkbox-container">
                        <input type="checkbox" id="checkPassRegister"><span>Mostrar contraseña</span>
                    </div>
                    <button type="submit" id="btnRegister" class="buttons">Registrarse</button>
                    <span>¿YA TIENES CUENTA? <a href="#" id="link-to-login">INICIA SESIÓN</a></span>
                </form>
            </div>
        </div>
    </div>

    <div id="app-content" class="blurred">
        <header id="header">
            <h1 id="title-header">MIS TAREAS</h1>
            <span id="text-pending">Pendientes 0/0</span>
        </header>
        <main id="main">
            <div id="insert-data">
                <div id="div-inputTask">
                    <input id="inputTarea" placeholder="Nueva tarea // vencimiento (dd-mm-aaaa)">
                    <button id="btnAgregar" class="buttons">Agregar</button>
                </div>
                <p id="message-error"></p>        
            </div>
            <div id="div-filters">
                <button id="buttonAll" class="filter-btn buttons">Todas</button>
                <button id="buttonPending" class="filter-btn buttons">Pendientes</button>
                <button id="buttonCompleted" class="filter-btn buttons">Completadas</button>
            </div>
            <div id="list-data">
                <ul id="lista"></ul>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="./js/app.js"></script>
</body>

</html>
